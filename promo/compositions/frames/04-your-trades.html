  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="04-your-trades"]');
      var q = function (id) {
        return root.querySelector("#" + id);
      };
      var qa = function (sel) {
        return Array.prototype.slice.call(root.querySelectorAll(sel));
      };

      var world = root.querySelector(".f04-your-trades-world");
      var tape = q("f04-your-trades-tape");
      var ghosts = qa(".f04-your-trades-ghost");
      var hairline = q("f04-your-trades-hairline");
      var heads = qa(".f04-your-trades-head span");
      var rows = qa(".f04-your-trades-row");
      var pnls = qa(".f04-your-trades-pnl");
      var ruleBar = q("f04-your-trades-rule");
      var caret = q("f04-your-trades-caret");
      var kicker = q("f04-your-trades-kicker");
      var words = qa(".f04-your-trades-w");

      // motion-blur-streak, path A — directional blur tweened as an ATTRIBUTE, not through
      // an onUpdate proxy: a seeked renderer suppresses callbacks, so a proxy would freeze.
      var blurNode = q("f04-your-trades-blur");
      var typed = q("f04-your-trades-typed");
      var CHARS = typed.textContent.length;

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // Every entrance is a fromTo: its from-state renders immediately at build time, so a
      // seek to any frame before the entrance shows the element correctly hidden.

      // macro camera: a slow push under the whole shot
      tl.fromTo(world, { scale: 1 }, { scale: 1.022, duration: 4, ease: "none" }, 0);

      // ---- Scene 1 (0.0–1.2) — the tape streaks in from the left edge ----
      tl.fromTo(tape, { x: -1500 }, { x: 0, duration: 0.55, ease: "power3.out" }, 0);
      // motion-blur-streak path B: an SVG smear is invisible on a 1px tick field, so the
      // velocity is carried by echo ghosts on the SAME window and ease. ECHO_STEP is scaled
      // to the TICK (4px against 11px spacing), not to the tape — the smear must read on the
      // hairline, which is the thing the eye tracks.
      ghosts.forEach(function (g) {
        var i = +g.getAttribute("data-i");
        tl.fromTo(
          g,
          { x: -1500 - i * 4, opacity: 0.5 / i },
          { x: 0, opacity: 0, duration: 0.55, ease: "power3.out" },
          0,
        );
      });
      tl.to(tape, { x: -34, duration: 0.65, ease: "none" }, 0.55); // live-feed drift

      // ---- Scene 2 (1.2–2.5) — the stream collapses inward, structure assembles ----
      tl.to(
        tape,
        {
          x: 0,
          scaleX: 0.313,
          scaleY: 0.012,
          y: -220,
          opacity: 0.4,
          duration: 0.55,
          ease: "power2.inOut",
        },
        1.15,
      );
      // inOut leg: blur peaks at mid-leg velocity, resolves as the tape lands on the hairline
      tl.to(blurNode, { attr: { stdDeviation: "7 0" }, duration: 0.28, ease: "power2.in" }, 1.15);
      tl.to(blurNode, { attr: { stdDeviation: "0 0" }, duration: 0.27, ease: "power2.out" }, 1.43);
      tl.to(tape, { opacity: 0, duration: 0.18, ease: "none" }, 1.7);

      tl.fromTo(
        hairline,
        { scaleX: 0, transformOrigin: "left center" },
        { scaleX: 1, duration: 0.4, ease: "expo.out" },
        1.6,
      );
      // the kicker labels the ledger, so it arrives with the ledger's chrome — it anchors
      // the upper field while the statement waits for its Scene 3 beat.
      tl.fromTo(
        kicker,
        { opacity: 0, y: -8 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" },
        1.62,
      );
      tl.fromTo(
        heads,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", stagger: 0.03 },
        1.62,
      );

      rows.forEach(function (row, i) {
        var at = 1.66 + i * 0.05;
        tl.fromTo(
          row,
          { opacity: 0, x: -46 },
          { opacity: 1, x: 0, duration: 0.36, ease: "power3.out" },
          at,
        );
        // the P&L prints a beat after its row lands — the number is the payload
        tl.fromTo(
          pnls[i],
          { opacity: 0, x: -14 },
          { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" },
          at + 0.12,
        );
      });

      // ---- Scene 3 (1.7–4.0) — the statement lands, THEN the source path types on ----
      // The headline is the claim and the path is its footnote, so the claim goes
      // first: at 2.94 the frame read as an unlabelled table for 73% of its life.
      tl.fromTo(
        words,
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.055 },
        1.7,
      );
      tl.fromTo(
        ruleBar,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.25, ease: "power3.out" },
        2.32,
      );
      tl.fromTo(caret, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, 2.38);
      tl.fromTo(
        typed,
        { width: 0 },
        { width: CHARS + "ch", duration: 0.55, ease: "steps(" + CHARS + ")" },
        2.40,
      );

      // hold the landed frame out to the full duration
      tl.to(caret, { opacity: 1, duration: 0.01, ease: "none" }, 3.99);

      window.__timelines["04-your-trades"] = tl;
    })();
