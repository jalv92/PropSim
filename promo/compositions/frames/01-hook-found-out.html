  <script>
    (function () {
      // One tempo grid drives the whole shot — geometry beats and type beats alike.
      var PULSE = 0.175;
      var T_RISE = 0; //  0.000  climb self-draws
      var T_FLOOR = PULSE * 8; //  1.400  the floor hard-cuts on
      var T_PLUNGE = PULSE * 9; //  1.575  the path rolls over
      var T_DEAD = PULSE * 12; //  2.100  contact — stroke dies red
      var T_L1 = PULSE * 14; //  2.450  "you found out"
      var T_L2 = PULSE * 17; //  2.975  "after you paid."

      var tl = gsap.timeline({ paused: true });

      // Measured dash geometry — never a guessed length.
      ["#hk-rise", "#hk-fall"].forEach(function (sel) {
        var p = document.querySelector(sel);
        if (!p) return;
        // fallback guards the pathological 0-measure, which would otherwise
        // render the whole curve solid from frame one.
        var len = p.getTotalLength() || 1600;
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
        p.dataset.len = String(len);
      });

      // Scene 1 — the climb draws at constant speed, like a live tick.
      tl.to(
        "#hk-rise",
        { strokeDashoffset: 0, duration: T_FLOOR - T_RISE, ease: "none" },
        T_RISE,
      );

      // Scene 2 — the floor was always there; it just cuts on. No fade.
      tl.fromTo(
        "#hk-floor",
        { opacity: 0 },
        { opacity: 1, duration: 0.01, ease: "none" },
        T_FLOOR,
      );

      // …the path keeps drawing and accelerates into it.
      tl.to(
        "#hk-fall",
        { strokeDashoffset: 0, duration: T_DEAD - T_PLUNGE, ease: "power2.in" },
        T_PLUNGE,
      );

      // Contact: the whole stroke turns red and the draw stops dead.
      tl.to(
        ".hk-eq",
        { stroke: "#f2635f", duration: 0.09, ease: "none" },
        T_DEAD,
      );
      tl.fromTo(
        "#hk-tick",
        { opacity: 0 },
        { opacity: 1, duration: 0.01, ease: "none" },
        T_DEAD,
      );

      // Scene 3 — two lines slam in, one per beat, distinct entrance each.
      tl.fromTo(
        "#hk-l1",
        { scale: 1.5, filter: "blur(16px)", opacity: 0 },
        {
          scale: 1,
          filter: "blur(0px)",
          opacity: 1,
          duration: 0.42,
          ease: "power4.out",
        },
        T_L1,
      );
      tl.fromTo(
        "#hk-l2",
        { x: -320, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" },
        T_L2,
      );

      // …then it holds. The stillness is the point.
      window.__timelines = window.__timelines || {};
      window.__timelines["01-hook-found-out"] = tl;
    })();
