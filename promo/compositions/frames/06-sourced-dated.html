    (function () {

      var q = function (sel) {

        fieldEl.appendChild(cluster);
        for (var j = 0; j < n; j++) {
          var el = document.createElement("div");
          el.className = "f06-mark";
          cluster.appendChild(el);
          // stagger is pure index math: cluster order, then reading order inside it
          marks.push({ el: el, at: 1.22 + ci * 0.08 + (j / n) * 0.62 });
        }
      });

      var tl = gsap.timeline({ paused: true });

      /* ---- macro camera: slow push-in under the whole shot ---- */

        q("#f06-stage"),
        { scale: 1 },
        { scale: 1.022, duration: 4.5, ease: "none" },
        0,
      );

        { opacity: 1, duration: 0.4, ease: "power2.out", stagger: 0.08 },

        { scaleX: 0 },
        { scaleX: 1, duration: 0.8, ease: "power3.out" },
        0.06,

      /* ---- SCENE 1 (0.0-1.2s): five firm chips self-assemble ---- */

        qa(".f06-chip"),
        { opacity: 0, y: 26, scale: 0.94 },
        {
          opacity: 1,
          y: 0,
          scale: 1,
          duration: 0.6,
          ease: "power3.out",
          stagger: 0.13,
        },
        0.08,
      );

      /* ---- SCENE 2 (1.2-2.5s): band, counter, 148 ticks ---- */

        q("#f06-band-rule"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.7, ease: "power3.out" },
        1.08,
      );

      // counter: 000 -> 148, chorded with a matching scale-up (counting-dynamic-scale)
      var countEl = q("#f06-count");
      var ctr = { v: 0 };
      tl.fromTo(
        countEl,
        { opacity: 0, scale: 0.92 },
        { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" },
        1.22,
      );
      tl.to(
        ctr,
        {
          v: 148,
          duration: 1.2,
          ease: "power2.out",
          snap: { v: 1 },
          onUpdate: function () {
            countEl.textContent = String(Math.round(ctr.v)).padStart(3, "0");
          },
        },
        1.22,
      );
      // land it hard: any frame sampled after the count-up reads 148, never 147
      tl.set(countEl, { textContent: "148" }, 2.42);
      tl.fromTo(
        q("#f06-count-label"),
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },

          { scale: 0.4, opacity: 0, backgroundColor: "#34d399" },
          {

            opacity: 0.82,
            backgroundColor: "#5f646b",

      qa(".f06-date").forEach(function (dateEl, ci) {

            { opacity: 0, y: 8 },
            { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" },
            2.52 + ci * 0.13 + wi * 0.07,
