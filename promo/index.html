<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #e7e9ea;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook-found-out"
        class="scene"
        data-composition-id="01-hook-found-out"
        data-composition-src="compositions/frames/01-hook-found-out.html"
        data-start="0"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-02-ten-thousand"
        class="scene"
        data-composition-id="02-ten-thousand"
        data-composition-src="compositions/frames/02-ten-thousand.html"
        data-start="4"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-03-two-questions"
        class="scene"
        data-composition-id="03-two-questions"
        data-composition-src="compositions/frames/03-two-questions.html"
        data-start="8"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-04-your-trades"
        class="scene"
        data-composition-id="04-your-trades"
        data-composition-src="compositions/frames/04-your-trades.html"
        data-start="12"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-05-the-floor"
        class="scene"
        data-composition-id="05-the-floor"
        data-composition-src="compositions/frames/05-the-floor.html"
        data-start="16"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-06-sourced-dated"
        class="scene"
        data-composition-id="06-sourced-dated"
        data-composition-src="compositions/frames/06-sourced-dated.html"
        data-start="21"
        data-duration="4.5"
        data-track-index="1"
      ></div>

      <div
        id="el-07-not-a-prediction"
        class="scene"
        data-composition-id="07-not-a-prediction"
        data-composition-src="compositions/frames/07-not-a-prediction.html"
        data-start="25.5"
        data-duration="4.5"
        data-track-index="1"
      ></div>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/bgm/track.wav"
        data-start="0"
        data-duration="30"
        data-track-index="11"
        data-volume="0.9"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
